<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Image Captioning AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Image Captioning AI</h1>

        <p class="subtitle">
            Upload an image and let AI generate a description.
        </p>

        <form method="POST"
              enctype="multipart/form-data">

            <input type="file"
                   name="image"
                   accept="image/*"
                   required>

            <button type="submit">
                Generate Caption
            </button>

        </form>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


      {% if image_path %}

    <div class="result">

        <h2>Uploaded Image</h2>

        <img src="{{ url_for(
                    'uploaded_file',
                    filename=image_path.split('/')[-1]
                  ) }}"
             alt="Uploaded Image">

    </div>

{% endif %}


        {% if caption %}

            <div class="caption-box">

                <h2>Generated Caption</h2>

                <p>
                    {{ caption }}
                </p>

            </div>

        {% endif %}

    </div>

</body>

</html>
